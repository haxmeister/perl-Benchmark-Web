name: Verify current H2O target

on:
  push:
    branches:
      - docs/fix-libh2o-install

permissions:
  contents: read

jobs:
  verify-h2o:
    if: github.event.head_commit.message == 'Verify current H2O target integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install H2O build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev zlib1g-dev git

      - name: Build and install current upstream H2O
        shell: bash
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/h2o/h2o.git /tmp/h2o
          cmake -S /tmp/h2o -B /tmp/h2o/build
          cmake --build /tmp/h2o/build -j2
          sudo cmake --install /tmp/h2o/build
          sudo ldconfig

      - name: Inspect installed evloop library
        shell: bash
        run: |
          set -euo pipefail
          perl benchmarks/http/servers/h2o/server.pl probe
          perl benchmarks/http/servers/h2o/server.pl version
          pcdir=$(find /usr/local -name libh2o-evloop.pc -print -quit)
          test -n "$pcdir"
          libdir=$(grep '^libdir=' "$pcdir" | cut -d= -f2-)
          echo "pc=$pcdir"
          echo "libdir=$libdir"
          find "$libdir" -maxdepth 1 -name 'libh2o-evloop*' -print
          for lib in "$libdir"/libh2o-evloop*; do
            test -e "$lib" || continue
            nm -A "$lib" 2>/dev/null | grep -E ' h2o_accept$| h2o_create_handler$' || true
          done

      - name: Compile through target launcher
        shell: bash
        run: |
          set -euo pipefail
          perl benchmarks/http/servers/h2o/server.pl prepare
          perl benchmarks/http/servers/h2o/server.pl cleanup

      - name: Smoke H2O through generic runner
        shell: bash
        run: |
          set -euo pipefail
          perl benchmarks/http/run.pl --servers=h2o --smoke --strict
          perl benchmarks/http/run.pl --servers=h2o --smoke --strict --request-body-bytes=4096
