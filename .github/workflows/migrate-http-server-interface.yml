name: Migrate HTTP server launcher interface

on:
  push:
    branches:
      - docs/fix-libh2o-install

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Retry HTTP server launcher migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-libh2o-install

      - name: Apply launcher migration
        shell: bash
        run: python3 .github/scripts/migrate_http_server_interface.py

      - name: Validate launcher contract
        shell: bash
        run: |
          set -euo pipefail
          perl -c benchmarks/http/run.pl
          for launcher in benchmarks/http/servers/*/server.pl; do
            perl -c "$launcher"
            perl "$launcher" info | python3 -c 'import json,sys; x=json.load(sys.stdin); assert isinstance(x.get("label"), str) and x["label"]'
          done
          perl benchmarks/http/run.pl --help | grep -F 'discovered server keys'

      - name: Smoke generic built-in targets
        shell: bash
        run: |
          set -euo pipefail
          perl benchmarks/http/run.pl --servers=node,go --smoke --strict
          perl benchmarks/http/run.pl --servers=node,go --smoke --strict --request-body-bytes=4096

      - name: Prove folder-only discovery
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum benchmarks/http/run.pl)
          cp -a benchmarks/http/servers/node benchmarks/http/servers/discovery-test
          perl benchmarks/http/run.pl --servers=discovery-test --smoke --strict | tee /tmp/discovery-test.out
          grep -F 'Node.js http' /tmp/discovery-test.out
          rm -rf benchmarks/http/servers/discovery-test
          after=$(sha256sum benchmarks/http/run.pl)
          test "$before" = "$after"

      - name: Commit migrated interface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Benchmark::Web CI'
          git config user.email 'actions@users.noreply.github.com'
          git add benchmarks/http/run.pl benchmarks/http/README.md benchmarks/http/servers CONTRIBUTING.md
          git commit -m 'Make HTTP server adapters self-registering'
          git push origin HEAD:docs/fix-libh2o-install
