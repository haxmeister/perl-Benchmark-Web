name: Apply libh2o documentation fix

on:
  push:
    branches:
      - docs/fix-libh2o-install

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage libh2o installation documentation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-libh2o-install

      - name: Correct libh2o installation instructions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('benchmarks/http/README.md')
          text = path.read_text()
          old = '''On Debian/Ubuntu, optional libh2o reference support can typically be enabled with:\n\n```sh\nsudo apt-get install build-essential pkg-config libh2o-evloop-dev\nperl run.pl --servers=h2o --smoke\n```\n'''
          new = '''The `h2o` target needs the H2O library built with its native event loop and discoverable as `libh2o-evloop` through `pkg-config`. The `libh2o-evloop-dev` package is not available on every Debian-derived release, so building current upstream H2O is the reliable installation path. H2O upstream considers current `master` ready for general use and no longer publishes normal version releases.\n\nOn Debian/Ubuntu/Devuan systems, install the build prerequisites first:\n\n```sh\nsudo apt-get install build-essential cmake pkg-config libssl-dev zlib1g-dev git\n```\n\nThen clone H2O with its submodules and install it:\n\n```sh\ngit clone --recurse-submodules https://github.com/h2o/h2o.git\ncd h2o\nmkdir -p build\ncd build\ncmake ..\nmake -j\"$(nproc)\"\nsudo make install\nsudo ldconfig\n```\n\nVerify that the library required by this benchmark is visible:\n\n```sh\npkg-config --modversion libh2o-evloop\n```\n\nThen run the benchmark from `benchmarks/http/`:\n\n```sh\nperl run.pl --servers=h2o --smoke --strict\n```\n\nIf H2O was installed under a custom prefix and `pkg-config` cannot find it, add that prefix's `lib/pkgconfig` directory to `PKG_CONFIG_PATH` before running the benchmark. For example, for the default `/usr/local` prefix on systems where it is not searched automatically:\n\n```sh\nexport PKG_CONFIG_PATH=/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}\npkg-config --modversion libh2o-evloop\n```\n\nSome distributions still package `libh2o-evloop-dev`. If `apt-cache show libh2o-evloop-dev` succeeds on your release, installing that package together with `build-essential` and `pkg-config` is a valid shortcut. Do not assume the package exists merely because the system is Debian- or Ubuntu-derived.\n'''
          if old not in text:
              raise SystemExit('old libh2o installation block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name 'Benchmark::Web CI'
          git config user.email 'actions@users.noreply.github.com'
          git add benchmarks/http/README.md
          git commit -m 'Fix libh2o installation instructions'
          git push origin HEAD:docs/fix-libh2o-install
