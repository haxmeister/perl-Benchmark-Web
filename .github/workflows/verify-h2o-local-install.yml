name: Verify target-local H2O install

on:
  push:
    branches:
      - fix/h2o-local-source-install

permissions:
  contents: read

jobs:
  h2o-local-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install only H2O build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev zlib1g-dev git
      - name: Build target-local H2O
        run: bash benchmarks/http/servers/h2o/install.sh
      - name: Verify launcher detection and compile
        working-directory: benchmarks/http
        run: |
          perl servers/h2o/server.pl probe
          perl servers/h2o/server.pl version
          perl servers/h2o/server.pl prepare
          perl servers/h2o/server.pl cleanup
      - name: Smoke H2O through generic runner
        working-directory: benchmarks/http
        run: |
          perl run.pl --servers=h2o --smoke --strict
          perl run.pl --servers=h2o --smoke --strict --request-body-bytes=4096
