name: Verify libh2o source install

on:
  push:
    branches:
      - docs/fix-libh2o-install

permissions:
  contents: read

jobs:
  verify-libh2o:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install documented prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev zlib1g-dev git

      - name: Build and install current upstream H2O
        shell: bash
        run: |
          git clone --recurse-submodules https://github.com/h2o/h2o.git /tmp/h2o
          cd /tmp/h2o
          mkdir -p build
          cd build
          cmake ..
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Verify libh2o evloop discovery
        shell: bash
        run: |
          pkg-config --modversion libh2o-evloop

      - name: Smoke benchmark libh2o
        shell: bash
        run: |
          perl benchmarks/http/run.pl --servers=h2o --smoke --strict
