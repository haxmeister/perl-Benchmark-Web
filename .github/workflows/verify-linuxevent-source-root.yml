name: Verify LinuxEvent source-root setup

on:
  push:
    branches:
      - docs/fix-libh2o-install

permissions:
  contents: read

jobs:
  verify-linuxevent:
    if: github.event.head_commit.message == 'Diagnose LinuxEvent source probe'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout LinuxEvent HTTP source
        uses: actions/checkout@v4
        with:
          repository: haxmeister/perl-Linux-Event-Net-HTTP
          ref: main
          path: linuxevent-http

      - name: Install build prerequisite
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus build-essential
          sudo cpanm --notest Linux::Event

      - name: Build LinuxEvent HTTP checkout
        shell: bash
        run: |
          cd linuxevent-http
          perl Makefile.PL
          make -j2

      - name: Diagnose source checkout loading
        shell: bash
        run: |
          set +e
          root="$GITHUB_WORKSPACE/linuxevent-http"
          lib="$root/blib/lib"
          arch="$root/blib/arch"
          printf '%s\n' "$root" > benchmarks/http/servers/linuxevent/source-root
          echo 'direct module check:'
          perl -I"$lib" -I"$arch" \
            -MLinux::Event::Loop \
            -MLinux::Event::Net::HTTP::Connection \
            -MLinux::Event::Net::HTTP::Server \
            -e 'print "direct-ok\n"'
          echo "direct_status=$?"
          echo 'launcher probe:'
          perl benchmarks/http/servers/linuxevent/server.pl probe
          echo "probe_status=$?"
          echo 'launcher version:'
          perl benchmarks/http/servers/linuxevent/server.pl version
          echo "version_status=$?"
          exit 0
