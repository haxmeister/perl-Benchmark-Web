name: Apply HTTP benchmark audit fixes

on:
  push:
    branches:
      - audit/http-public-benchmark

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/http-public-benchmark

      - name: Apply audited fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "benchmarks/http/run.pl",
              '''                my $body_len = 0 + $1;
                last if length($s->{buffer}) < $head_len + $body_len;
''',
              '''                my $body_len = 0 + $1;
                die "benchmark response Content-Length $body_len did not match configured response bytes $response_bytes\\n"
                    if $body_len != $response_bytes;
                last if length($s->{buffer}) < $head_len + $body_len;
''',
          )

          replace(
              "benchmarks/http/servers/feersum-http.pl",
              '''$runner->run(sub ($request) {
    $request->send_response(
        200,
        ['Content-Type' => 'application/octet-stream'],
        \\$payload,
    );
    return;
});
''',
              '''$runner->run(sub ($request) {
    my $remaining = 0 + ($request->content_length // 0);
    if ($remaining > 0) {
        my $input = $request->input;
        die "missing benchmark request body\\n" if !defined $input;
        while ($remaining > 0) {
            my $want = $remaining > 65_536 ? 65_536 : $remaining;
            my $chunk = '';
            my $n = $input->read($chunk, $want);
            die "short benchmark request body\\n"
                if !defined($n) || $n <= 0;
            $remaining -= $n;
        }
        $input->close;
    }

    $request->send_response(
        200,
        [
            'Content-Type'   => 'application/octet-stream',
            'Content-Length' => length($payload),
        ],
        \\$payload,
    );
    return;
});
''',
          )

          replace(
              "benchmarks/http/servers/twiggy-http.pl",
              '''        my $input = $env->{'psgi.input'};
        while ($remaining > 0) {
            my $buf = '';
            my $n = $input->read($buf, $remaining);
            last if !defined($n) || $n <= 0;
            $remaining -= $n;
        }
''',
              '''        my $input = $env->{'psgi.input'};
        die "missing benchmark request body\\n" if !defined $input;
        while ($remaining > 0) {
            my $want = $remaining > 65_536 ? 65_536 : $remaining;
            my $buf = '';
            my $n = $input->read($buf, $want);
            die "short benchmark request body\\n"
                if !defined($n) || $n <= 0;
            $remaining -= $n;
        }
''',
          )

          replace(
              "benchmarks/http/servers/linuxevent-http.pl",
              '''our $READ_BUDGET_BYTES = 0 + ($ENV{BENCH_READ_BUDGET_BYTES} // 0);
my $payload = 'x' x $response_bytes;
''',
              '''our $READ_BUDGET_BYTES = 0 + ($ENV{BENCH_READ_BUDGET_BYTES} // 0);
our $REQUEST_BODY_BYTES = 0 + ($ENV{BENCH_REQUEST_BODY_BYTES} // 0);
my $payload = 'x' x $response_bytes;
''',
          )

          replace(
              "benchmarks/http/servers/linuxevent-http.pl",
              '''    sub on_request ($self, $request, $response) {
        $response->end($self->data->{payload});
        return;
    }
}

{
    package Benchmark::Web::HTTP::LinuxEvent::RequestEnd;
''',
              '''    sub on_request ($self, $request, $response) {
        return if $main::REQUEST_BODY_BYTES > 0;
        $response->end($self->data->{payload});
        return;
    }

    sub on_request_end ($self, $request, $response) {
        return if $main::REQUEST_BODY_BYTES == 0;
        $response->end($self->data->{payload});
        return;
    }
}

{
    package Benchmark::Web::HTTP::LinuxEvent::RequestEnd;
''',
          )

          replace(
              "benchmarks/http/README.md",
              '''```sh
perl run.pl --servers=hyperman,feersum,mojo --strict
```

### `--json=PATH`
''',
              '''```sh
perl run.pl --servers=hyperman,feersum,mojo --strict
```

`--no-strict` explicitly restores the default skip behavior.

### `--json=PATH`
''',
          )

          replace(
              "benchmarks/http/README.md",
              '''This variable changes only the Linux::Event adapter. Do not mix different Linux::Event modes into one published result without labeling them separately.

## Interpreting results
''',
              '''This variable changes only the Linux::Event adapter. Do not mix different Linux::Event modes into one published result without labeling them separately.

For body-bearing benchmark requests, the `natural` adapter defers its response until `on_request_end` so the request body is fully consumed before responding. The bodyless default still measures the ordinary early `on_request -> Response->end` path.

## Files in this folder

```text
README.md
run.pl
servers/
    aiohttp-http.py
    feersum-http.pl
    go-http.go
    hyperman-http.pl
    libh2o-http.c
    linuxevent-http.pl
    mojo-http.pl
    node-http.js
    twiggy-http.pl
```

Nothing outside this directory is required unless you explicitly select an optional target that is not already installed. An uninstalled Linux::Event::Net::HTTP checkout is supplied explicitly with `BENCH_LINUXEVENT_ROOT`.

## Continuous integration

Repository CI uses small correctness workloads, including a required smoke comparison that does not select Linux::Event. Optional Perl-adapter CI may install benchmark targets temporarily to exercise their adapters; those installations are test fixtures, not Benchmark::Web dependencies.

CI throughput is not a publishable performance result.

## Interpreting results
''',
          )

          replace(
              "CONTRIBUTING.md",
              '''A runner should detect missing competitors and skip them by default, with a strict mode when a reproducible run requires an exact target set.

## Results
''',
              '''A runner should detect missing competitors and skip them by default, with a strict mode when a reproducible run requires an exact target set.

CI may install optional benchmark targets temporarily to exercise adapters. That does not make those targets project dependencies: do not add them to core package metadata or assume every contributor has them installed.

## Results
''',
          )

          ci = '''name: Benchmark checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check runner and adapter syntax
        shell: bash
        run: |
          perl -c benchmarks/http/run.pl
          node --check benchmarks/http/servers/node-http.js
          python3 -m py_compile benchmarks/http/servers/aiohttp-http.py
          go build -o /tmp/benchmark-web-go-syntax benchmarks/http/servers/go-http.go

      - name: Install aiohttp in an isolated environment
        shell: bash
        run: |
          python3 -m venv /tmp/benchmark-web-venv
          /tmp/benchmark-web-venv/bin/pip install aiohttp

      - name: Smoke HTTP comparison without Linux::Event
        shell: bash
        run: |
          PATH="/tmp/benchmark-web-venv/bin:$PATH" \
            perl benchmarks/http/run.pl \
              --servers=node,go,aiohttp \
              --smoke \
              --strict \
              --json=/tmp/http-smoke.json
          test -s /tmp/http-smoke.json

      - name: Exercise fixed request bodies without Linux::Event
        shell: bash
        run: |
          PATH="/tmp/benchmark-web-venv/bin:$PATH" \
            perl benchmarks/http/run.pl \
              --servers=node,go,aiohttp \
              --smoke \
              --strict \
              --request-body-bytes=4096

  optional-perl-adapters:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install optional Perl benchmark targets
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus build-essential
          sudo cpanm --notest Hyperman Feersum Mojolicious

      - name: Smoke optional Perl adapters
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=hyperman,feersum,mojo \
            --smoke \
            --strict

      - name: Exercise request-body contract
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=hyperman,feersum,mojo \
            --smoke \
            --strict \
            --request-body-bytes=4096
'''
          ci_path = Path('.github/workflows/ci.yml')
          ci_path.parent.mkdir(parents=True, exist_ok=True)
          ci_path.write_text(ci)

          Path('.github/workflows/audit-patch.yml').unlink()
          PY

      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Audit public HTTP benchmark contract and CI'
          git push origin HEAD:audit/http-public-benchmark
