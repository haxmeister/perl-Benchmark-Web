name: Apply HTTP benchmark audit fixes

on:
  push:
    branches:
      - audit/http-public-benchmark

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/http-public-benchmark

      - name: Apply audited fixes
        run: python3 .github/apply_http_audit.py

      - name: Validate patched files
        shell: bash
        run: |
          perl -c benchmarks/http/run.pl
          git diff --check

      - name: Commit audited fixes
        shell: bash
        run: |
          rm .github/apply_http_audit.py .github/workflows/audit-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Audit public HTTP benchmark contract'
          git push origin HEAD:audit/http-public-benchmark
