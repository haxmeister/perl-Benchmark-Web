name: Reorganize HTTP server docs

on:
  push:
    branches:
      - docs/fix-libh2o-install

permissions:
  contents: write

jobs:
  reorganize:
    if: github.event.head_commit.message == 'Fix HTTP documentation staging workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-libh2o-install

      - name: Apply reorganization
        run: python3 .github/scripts/reorganize_http_docs.py

      - name: Validate moved runners
        shell: bash
        run: |
          perl -c benchmarks/http/run.pl
          node --check benchmarks/http/servers/node/node-http.js
          python3 -m py_compile benchmarks/http/servers/aiohttp/aiohttp-http.py
          go build -o /tmp/benchmark-web-go-layout-check benchmarks/http/servers/go/go-http.go

      - name: Commit result
        shell: bash
        run: |
          git config user.name 'Benchmark::Web CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Organize HTTP server adapters and setup docs'
          git push origin HEAD:docs/fix-libh2o-install
