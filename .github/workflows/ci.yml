name: Benchmark checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check runner and launcher contract
        shell: bash
        run: |
          set -euo pipefail
          perl -c benchmarks/http/run.pl
          for launcher in benchmarks/http/servers/*/server.pl; do
            perl -c "$launcher"
            perl "$launcher" info | python3 -c 'import json,sys; x=json.load(sys.stdin); assert isinstance(x.get("label"), str) and x["label"]'
          done
          perl benchmarks/http/run.pl --help | grep -F 'discovered server keys'
          node --check benchmarks/http/servers/node/node-http.js
          python3 -m py_compile benchmarks/http/servers/aiohttp/aiohttp-http.py
          go build -o /tmp/benchmark-web-go-syntax benchmarks/http/servers/go/go-http.go

      - name: Reject missing target dependencies and build tools
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PATH=/nonexistent /usr/bin/perl benchmarks/http/servers/node/server.pl probe
          node_status=$?
          PATH=/nonexistent /usr/bin/perl benchmarks/http/servers/go/server.pl prepare
          go_prepare_status=$?
          set -e
          test "$node_status" -ne 0
          test "$go_prepare_status" -ne 0

      - name: Prove folder-only server discovery
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum benchmarks/http/run.pl)
          cp -a benchmarks/http/servers/node benchmarks/http/servers/discovery-test
          perl benchmarks/http/run.pl \
            --servers=discovery-test \
            --smoke \
            --strict | tee /tmp/http-discovery-smoke.out
          grep -F 'Node.js http' /tmp/http-discovery-smoke.out
          rm -rf benchmarks/http/servers/discovery-test
          after=$(sha256sum benchmarks/http/run.pl)
          test "$before" = "$after"

      - name: Honor target workload compatibility
        shell: bash
        run: |
          set -euo pipefail
          perl benchmarks/http/run.pl \
            --servers=node,twiggy,gazelle \
            --smoke \
            --json=/tmp/http-unsupported.json \
            | tee /tmp/http-unsupported.out
          grep -F 'Twiggy/AnyEvent [unsupported workload:' /tmp/http-unsupported.out
          grep -F 'Gazelle [unsupported workload:' /tmp/http-unsupported.out
          ! grep -F 'server closed connection before benchmark phase completed' /tmp/http-unsupported.out
          python3 - <<'PY'
          import json
          with open('/tmp/http-unsupported.json') as fh:
              report = json.load(fh)
          assert set(report['configuration']['skipped']) == {'twiggy', 'gazelle'}
          assert 'persistent HTTP/1.1' in report['configuration']['skipped_reasons']['twiggy']
          assert 'keep-alive' in report['configuration']['skipped_reasons']['gazelle']
          PY

          set +e
          perl benchmarks/http/run.pl --servers=twiggy --smoke \
            >/tmp/http-unsupported-only.out 2>&1
          only_status=$?
          perl benchmarks/http/run.pl --servers=node,twiggy --smoke --strict \
            >/tmp/http-unsupported-strict.out 2>&1
          strict_status=$?
          set -e
          test "$only_status" -ne 0
          test "$strict_status" -ne 0
          grep -F 'persistent HTTP/1.1' /tmp/http-unsupported-only.out
          grep -F 'unsupported workload:' /tmp/http-unsupported-strict.out
          ! grep -F 'server closed connection before benchmark phase completed' /tmp/http-unsupported-only.out
          ! grep -F 'server closed connection before benchmark phase completed' /tmp/http-unsupported-strict.out

      - name: Honor target persistent-connection limits
        shell: bash
        run: |
          set -euo pipefail
          perl benchmarks/http/run.pl \
            --servers=node,starman \
            --smoke \
            --json=/tmp/http-connection-limit.json \
            | tee /tmp/http-connection-limit.out
          grep -F 'Starman [workload requests 4 persistent connections; target benchmark configuration supports at most 1]' /tmp/http-connection-limit.out
          python3 - <<'PY'
          import json
          with open('/tmp/http-connection-limit.json') as fh:
              report = json.load(fh)
          assert report['configuration']['skipped'] == ['starman']
          assert 'supports at most 1' in report['configuration']['skipped_reasons']['starman']
          PY

      - name: Smoke comparison without Linux::Event
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=node,go \
            --smoke \
            --strict \
            --json=/tmp/http-smoke.json | tee /tmp/http-smoke.out
          test -s /tmp/http-smoke.json
          grep -F 'Benchmark::Web - HTTP/1.1 Cross-Server Comparison' /tmp/http-smoke.out
          grep -F 'SMOKE - correctness check only' /tmp/http-smoke.out
          grep -F 'Measured requests/repeat:' /tmp/http-smoke.out
          grep -F 'Warmup requests/repeat:' /tmp/http-smoke.out
          grep -F 'Pipeline depth:' /tmp/http-smoke.out
          grep -F 'Request:' /tmp/http-smoke.out
          grep -F 'Response:' /tmp/http-smoke.out
          grep -F 'Target setup:' /tmp/http-smoke.out
          grep -F 'MEDIAN RESULTS' /tmp/http-smoke.out
          python3 - <<'PY'
          import json
          with open('/tmp/http-smoke.json') as fh:
              report = json.load(fh)
          assert 'servers' in report['environment']
          assert 'node' in report['environment']['servers']
          assert 'go' in report['environment']['servers']
          PY

      - name: Exercise request-body contract without Linux::Event
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=node,go \
            --smoke \
            --strict \
            --request-body-bytes=4096 | tee /tmp/http-body-smoke.out
          grep -E 'Request: +POST /bench, body=4096 bytes' /tmp/http-body-smoke.out

  optional-http-adapters:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install optional benchmark targets
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus build-essential
          sudo cpanm --notest Hyperman Feersum Mojolicious Starman
          bash benchmarks/http/servers/linuxevent/install.sh
          python3 -m venv benchmarks/http/servers/aiohttp/.venv
          benchmarks/http/servers/aiohttp/.venv/bin/pip install aiohttp

      - name: Check optional Perl adapter syntax
        shell: bash
        run: |
          perl benchmarks/http/servers/linuxevent/server.pl probe
          perl benchmarks/http/servers/linuxevent/server.pl version
          printf '\n'
          perl -c benchmarks/http/servers/hyperman/hyperman-http.pl
          perl -c benchmarks/http/servers/feersum/feersum-http.pl
          perl -c benchmarks/http/servers/mojo/mojo-http.pl
          perl -c benchmarks/http/servers/starman/starman-http.psgi

      - name: Smoke selected public comparison
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=linuxevent,hyperman,feersum,mojo,node,go,aiohttp \
            --smoke \
            --strict

      - name: Smoke Starman single-slot profile
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=starman \
            --requests=500 \
            --warmup=100 \
            --connections=1 \
            --repeats=1 \
            --timeout=20 \
            --strict

      - name: Exercise selected request-body contract
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=linuxevent,hyperman,feersum,mojo,node,go,aiohttp \
            --smoke \
            --strict \
            --request-body-bytes=4096\n
  baseline-websocket-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install shared WebSocket client
        working-directory: benchmarks/websocket
        run: npm install

      - name: Check WebSocket runner and launcher contract
        shell: bash
        run: |
          set -euo pipefail
          perl -c benchmarks/websocket/run.pl
          for launcher in benchmarks/websocket/servers/*/server.pl; do
            perl -c "$launcher"
            perl "$launcher" info | python3 -c 'import json,sys; x=json.load(sys.stdin); assert isinstance(x.get("label"), str) and x["label"]'
          done
          node --check benchmarks/websocket/load.mjs
          node --check benchmarks/websocket/servers/nodews/node-ws.mjs
          perl benchmarks/websocket/run.pl --help | grep -F 'discovered server keys'

      - name: Smoke comparison without Linux::Event
        shell: bash
        run: |
          perl benchmarks/websocket/run.pl \
            --servers=nodews,gorilla \
            --smoke \
            --strict \
            --json=/tmp/websocket-smoke.json | tee /tmp/websocket-smoke.out
          test -s /tmp/websocket-smoke.json
          grep -F 'Benchmark::Web WebSocket application comparison' /tmp/websocket-smoke.out
          grep -F 'Median summary' /tmp/websocket-smoke.out
          python3 - <<'PY'
          import json
          with open('/tmp/websocket-smoke.json') as fh:
              report = json.load(fh)
          assert report['benchmark'] == 'benchmark-web-websocket-application'
          assert report['configuration']['window'] == 1
          assert 'nodews' in report['environment']['servers']
          assert 'gorilla' in report['environment']['servers']
          PY

  optional-websocket-adapters:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install WebSocket benchmark dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus build-essential libssl-dev
          (cd benchmarks/websocket && npm install)
          sudo cpanm --notest Mojolicious
          git clone --depth 1 https://github.com/haxmeister/perl-Uniform-HTTP.git /tmp/perl-Uniform-HTTP
          sudo cpanm --notest /tmp/perl-Uniform-HTTP
          git clone --depth 1 https://github.com/haxmeister/perl-linux-event.git /tmp/perl-linux-event
          sudo cpanm --notest /tmp/perl-linux-event
          git clone --depth 1 https://github.com/haxmeister/perl-Linux-Event-HTTP.git /tmp/perl-Linux-Event-HTTP
          sudo cpanm --notest /tmp/perl-Linux-Event-HTTP
          git clone --depth 1 https://github.com/haxmeister/perl-Linux-Event-WebSocket.git /tmp/perl-Linux-Event-WebSocket
          (cd /tmp/perl-Linux-Event-WebSocket && perl Makefile.PL && make)
          printf '%s\n' /tmp/perl-Linux-Event-WebSocket > benchmarks/websocket/servers/linuxevent/source-root

      - name: Smoke all initial WebSocket adapters
        shell: bash
        run: |
          perl benchmarks/websocket/run.pl \
            --servers=linuxevent,mojo,nodews,gorilla \
            --smoke \
            --strict
