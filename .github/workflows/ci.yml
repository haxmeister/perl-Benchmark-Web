name: Benchmark checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check runner and launcher contract
        shell: bash
        run: |
          set -euo pipefail
          perl -c benchmarks/http/run.pl
          for launcher in benchmarks/http/servers/*/server.pl; do
            perl -c "$launcher"
            perl "$launcher" info | python3 -c 'import json,sys; x=json.load(sys.stdin); assert isinstance(x.get("label"), str) and x["label"]'
          done
          perl benchmarks/http/run.pl --help | grep -F 'discovered server keys'
          node --check benchmarks/http/servers/node/node-http.js
          python3 -m py_compile benchmarks/http/servers/aiohttp/aiohttp-http.py
          go build -o /tmp/benchmark-web-go-syntax benchmarks/http/servers/go/go-http.go

      - name: Prove folder-only server discovery
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum benchmarks/http/run.pl)
          cp -a benchmarks/http/servers/node benchmarks/http/servers/discovery-test
          perl benchmarks/http/run.pl \
            --servers=discovery-test \
            --smoke \
            --strict | tee /tmp/http-discovery-smoke.out
          grep -F 'Node.js http' /tmp/http-discovery-smoke.out
          rm -rf benchmarks/http/servers/discovery-test
          after=$(sha256sum benchmarks/http/run.pl)
          test "$before" = "$after"

      - name: Smoke comparison without Linux::Event
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=node,go \
            --smoke \
            --strict \
            --json=/tmp/http-smoke.json | tee /tmp/http-smoke.out
          test -s /tmp/http-smoke.json
          grep -F 'Benchmark::Web - HTTP/1.1 Cross-Server Comparison' /tmp/http-smoke.out
          grep -F 'SMOKE - correctness check only' /tmp/http-smoke.out
          grep -F 'Measured requests/repeat:' /tmp/http-smoke.out
          grep -F 'Warmup requests/repeat:' /tmp/http-smoke.out
          grep -F 'Pipeline depth:' /tmp/http-smoke.out
          grep -F 'Request:' /tmp/http-smoke.out
          grep -F 'Response:' /tmp/http-smoke.out
          grep -F 'Target setup:' /tmp/http-smoke.out
          grep -F 'MEDIAN RESULTS' /tmp/http-smoke.out
          python3 - <<'PY'
          import json
          with open('/tmp/http-smoke.json') as fh:
              report = json.load(fh)
          assert 'servers' in report['environment']
          assert 'node' in report['environment']['servers']
          assert 'go' in report['environment']['servers']
          PY

      - name: Exercise request-body contract without Linux::Event
        shell: bash
        run: |
          perl benchmarks/http/run.pl \
            --servers=node,go \
            --smoke \
            --strict \
            --request-body-bytes=4096 | tee /tmp/http-body-smoke.out
          grep -E 'Request: +POST /bench, body=4096 bytes' /tmp/http-body-smoke.out

  optional-http-adapters:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install optional benchmark targets
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus build-essential
          sudo cpanm --notest Hyperman Feersum Mojolicious
          python3 -m venv /tmp/benchmark-web-venv
          /tmp/benchmark-web-venv/bin/pip install aiohttp

      - name: Check optional Perl adapter syntax
        shell: bash
        run: |
          perl -c benchmarks/http/servers/hyperman/hyperman-http.pl
          perl -c benchmarks/http/servers/feersum/feersum-http.pl
          perl -c benchmarks/http/servers/mojo/mojo-http.pl

      - name: Smoke selected public comparison
        shell: bash
        run: |
          PATH="/tmp/benchmark-web-venv/bin:$PATH" \
            perl benchmarks/http/run.pl \
              --servers=hyperman,feersum,mojo,node,go,aiohttp \
              --smoke \
              --strict

      - name: Exercise selected request-body contract
        shell: bash
        run: |
          PATH="/tmp/benchmark-web-venv/bin:$PATH" \
            perl benchmarks/http/run.pl \
              --servers=hyperman,feersum,mojo,node,go,aiohttp \
              --smoke \
              --strict \
              --request-body-bytes=4096
